spring.application.name=backend
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL Configuration
# Values are injected from environment variables (see .env.example at repo root)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrplatform}?stringtype=unspecified
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Server port
server.port=${SERVER_PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.hrplatform=DEBUG

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin seed account (used by DataInitializer)
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:change_me}

# RapidAPI – Job Listings Scheduler
rapidapi.jobs.url=https://linkedin-job-search-api.p.rapidapi.com/active-jb?description_format=text&location=Morocco&time_frame=6m&offset=0&limit=100
rapidapi.jobs.host=${RAPIDAPI_JOBS_HOST:linkedin-job-search-api.p.rapidapi.com}
rapidapi.jobs.key=${RAPIDAPI_JOBS_KEY}
